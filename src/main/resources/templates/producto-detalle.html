<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Consulta de producto')}"></head><body><div th:replace="~{fragments/layout :: menu}"></div>
<main class="container-fluid app-container px-3 px-xl-4 main-space"><div class="detail-card"><a th:href="@{/productos}" class="btn btn-soft mb-4"><i class="bi bi-arrow-left me-2"></i>Volver a productos</a><div class="surface"><div class="detail-header"><span class="eyebrow">FICHA DEL PRODUCTO</span><div class="d-flex align-items-center gap-3 mt-2"><span class="stat-icon wine" style="width:56px;height:56px;font-size:1.6rem"><i class="bi bi-egg-fried"></i></span><div><h1 class="h2 fw-bold mb-1" th:text="${registro.nombre}">Producto</h1><span class="text-muted small" th:text="${'Código #' + registro.id}">#1</span></div></div></div><div class="surface-body px-md-5 py-md-4"><dl class="mb-0"><div class="detail-row"><dt>Categoría</dt><dd th:text="${registro.categoria}"></dd></div><div class="detail-row"><dt>Precio de venta</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(registro.precio, 1, 2)}"></dd></div><div class="detail-row"><dt>Stock actual</dt><dd th:text="${registro.stock + ' unidades'}"></dd></div><div class="detail-row"><dt>Stock mínimo</dt><dd th:text="${registro.stockMinimo + ' unidades'}"></dd></div><div class="detail-row"><dt>Estado</dt><dd><span class="pill" th:classappend="${registro.stockBajo} ? 'pill-warn' : 'pill-good'" th:text="${registro.stockBajo} ? 'Stock bajo' : 'Disponible'"></span></dd></div></dl></div></div></div></main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
