<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#842c34">
  <title th:text="${titulo} + ' | Rápido & Rico'">Rápido &amp; Rico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head><body>
<div th:fragment="menu">
  <div class="topline"></div>
  <nav class="navbar navbar-expand-lg app-navbar sticky-top" aria-label="Navegación principal"><div class="container-fluid app-container px-3 px-xl-4">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}"><span class="brand-mark"><i class="bi bi-egg-fried"></i></span><span class="brand-name">Rápido<span>&amp;</span>Rico</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menuPrincipal"><ul class="navbar-nav mx-lg-auto gap-lg-1 mt-3 mt-lg-0">
      <li class="nav-item"><a class="nav-link" data-route="/" th:href="@{/}"><i class="bi bi-grid me-1"></i> Inicio</a></li>
      <li class="nav-item"><a class="nav-link" data-route="/productos" th:href="@{/productos}"><i class="bi bi-box-seam me-1"></i> Productos</a></li>
      <li class="nav-item"><a class="nav-link" data-route="/pedidos" th:href="@{/pedidos}"><i class="bi bi-receipt me-1"></i> Pedidos</a></li>
      <li class="nav-item"><a class="nav-link" data-route="/proveedores" th:href="@{/proveedores}"><i class="bi bi-people me-1"></i> Proveedores</a></li>
      <li class="nav-item"><a class="nav-link" data-route="/compras" th:href="@{/compras}"><i class="bi bi-bag-check me-1"></i> Compras</a></li>
      <li class="nav-item dropdown"><a class="nav-link dropdown-toggle" data-route="/graficos" href="#" role="button" data-bs-toggle="dropdown"><i class="bi bi-bar-chart-line me-1"></i> Reportes</a><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" th:href="@{/graficos/ventas}"><i class="bi bi-graph-up me-2"></i>Gráficos de ventas</a></li><li><a class="dropdown-item" th:href="@{/graficos/inventario}"><i class="bi bi-pie-chart me-2"></i>Gráficos de inventario</a></li></ul></li>
    </ul><span class="nav-hint"><i class="bi bi-circle-fill me-1" style="font-size:.5rem"></i> MODO DEMO</span></div>
  </div></nav>
</div>
<div th:fragment="avisos" class="container-fluid app-container px-3 px-xl-4 mt-3"><div th:if="${exito}" class="alert alert-success d-flex align-items-center gap-2 mb-0" role="alert"><i class="bi bi-check-circle-fill"></i><span th:text="${exito}"></span></div><div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-0" role="alert"><i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span></div></div>
<footer th:fragment="pie" class="app-footer py-4 mt-auto"><div class="container-fluid app-container px-3 px-xl-4 d-flex justify-content-between flex-wrap gap-2"><span><strong>Rápido&amp;Rico</strong> · Panel de operaciones</span><span>Avance 2 · Datos en memoria durante la ejecución</span></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>document.querySelectorAll('[data-route]').forEach(a=>{const route=a.dataset.route,path=location.pathname;if(route==='/'?path==='/':path===route||path.startsWith(route+'/'))a.classList.add('active')});</script></footer>
</body></html>
