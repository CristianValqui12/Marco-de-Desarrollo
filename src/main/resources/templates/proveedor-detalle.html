<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Consulta de proveedor')}"></head><body><div th:replace="~{fragments/layout :: menu}"></div>
<main class="container-fluid app-container px-3 px-xl-4 main-space"><div class="detail-card"><a th:href="@{/proveedores}" class="btn btn-soft mb-4"><i class="bi bi-arrow-left me-2"></i>Volver a proveedores</a><div class="surface"><div class="detail-header"><span class="eyebrow">FICHA DEL PROVEEDOR</span><div class="d-flex align-items-center gap-3 mt-2"><span class="stat-icon wine" style="width:56px;height:56px;font-size:1.6rem"><i class="bi bi-building"></i></span><div><h1 class="h2 fw-bold mb-1" th:text="${registro.razonSocial}">Proveedor</h1><span class="text-muted small" th:text="${'Código #' + registro.id}">#1</span></div></div></div><div class="surface-body px-md-5 py-md-4"><dl class="mb-0"><div class="detail-row"><dt>RUC</dt><dd th:text="${registro.ruc}"></dd></div><div class="detail-row"><dt>Teléfono</dt><dd th:text="${registro.telefono}"></dd></div><div class="detail-row"><dt>Correo electrónico</dt><dd th:text="${registro.correo}"></dd></div></dl></div></div></div></main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
