<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Consulta de compra')}"></head><body><div th:replace="~{fragments/layout :: menu}"></div>
<main class="container-fluid app-container px-3 px-xl-4 main-space"><div class="detail-card"><a th:href="@{/compras}" class="btn btn-soft mb-4"><i class="bi bi-arrow-left me-2"></i>Volver a compras</a><div class="surface"><div class="detail-header"><span class="eyebrow">DETALLE DE LA COMPRA</span><div class="d-flex align-items-center gap-3 mt-2"><span class="stat-icon blue" style="width:56px;height:56px;font-size:1.6rem"><i class="bi bi-bag-check"></i></span><div><h1 class="h2 fw-bold mb-1" th:text="${'Compra #' + registro.id}">Compra</h1><span class="text-muted small" th:text="${#temporals.format(registro.fecha, 'dd/MM/yyyy · HH:mm')}"></span></div></div></div><div class="surface-body px-md-5 py-md-4"><dl class="mb-0"><div class="detail-row"><dt>Proveedor</dt><dd th:text="${registro.proveedorNombre}"></dd></div><div class="detail-row"><dt>Producto</dt><dd th:text="${registro.productoNombre}"></dd></div><div class="detail-row"><dt>Cantidad</dt><dd th:text="${registro.cantidad + ' unidades'}"></dd></div><div class="detail-row"><dt>Costo unitario</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(registro.costoUnitario, 1, 2)}"></dd></div><div class="detail-row"><dt>Total</dt><dd class="fs-5" style="color:var(--wine)" th:text="${'S/ ' + #numbers.formatDecimal(registro.total, 1, 2)}"></dd></div></dl></div></div></div></main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
